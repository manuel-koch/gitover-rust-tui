[package]
name = "gitover"
version = "0.8.11"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/manuel-koch/gitover-rust-tui"

[[bin]]
name = "gitover"
path = "src/main.rs"

[lib]
name = "gitover"
path = "src/lib.rs"

[dependencies]
ratatui = "0.30"
unicode-width = "0.2"
crossterm = "0.29"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
notify = "6"
serde_yaml = "0.9"
ratatui-explorer = { version = "0.3", features = ["crossterm"] }
tui-textarea-2 = { version = "0.11", features = ["crossterm"] }
chrono = "0.4.44"
ureq = { version = "3", features = ["json"] }
arboard = "3"

[dev-dependencies]
tempfile = "3"
